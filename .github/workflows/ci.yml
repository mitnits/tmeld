name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure git for VC-view tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "tmeld CI"
          git config --global init.defaultBranch main
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[web]' pytest
      - name: Test
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke-test the wheel
        run: |
          pip install dist/*.whl
          tmeld --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  web-bundle:
    # the committed bmeld.js must match a fresh build of web/src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild client bundle
        run: cd web && npm ci && npm run build
      - name: Bundle is fresh
        run: git diff --stat --exit-code tmeld/web/static/bmeld.js

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts lintian \
            python3-pip python3-setuptools
      - name: Build .deb
        run: dpkg-buildpackage -us -uc -b
      - name: Lintian
        run: lintian ../tmeld_*_all.deb
      - name: Install and smoke-test
        run: |
          sudo dpkg -i ../tmeld_*_all.deb
          /usr/bin/tmeld --version
          printf 'a\n' > /tmp/a; printf 'b\n' > /tmp/b
          /usr/bin/tmeld-dump /tmp/a /tmp/b | grep -q replace
      - name: Collect artifact
        # dpkg-buildpackage writes to the parent dir; upload-artifact
        # refuses '..' paths
        run: mkdir -p debian-dist && cp ../tmeld_*_all.deb debian-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: debian-dist/
