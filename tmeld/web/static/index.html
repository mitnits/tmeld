<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bmeld</title>
<link rel="stylesheet" href="/assets/bmeld.css">
</head>
<body>
<div id="app">
  <div id="banner"></div>
  <div id="tabbar"></div>
  <div id="main"></div>
  <footer id="statusbar">
    <span id="stats">connecting…</span>
    <span id="cursor"></span>
    <span id="hints">Alt+↓/↑ change · Alt+←/→ push · Alt+Shift+←/→ pull ·
      Alt+Del delete · Ctrl+K/J conflict · Alt+M merge all · ⌘/Ctrl+S save</span>
    <span id="build" title="bmeld version and asset build id"></span>
    <button id="done">Done</button>
  </footer>
</div>
<script src="/assets/bmeld.js"></script>
</body>
</html>
